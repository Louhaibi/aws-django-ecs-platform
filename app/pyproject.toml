[project]
name = "aws-django-ecs-platform-app"
version = "0.1.0"
description = "Django application for the AWS Django ECS platform project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.16,<5.3",
    "django-filter>=26.1,<26.2",
    "django-environ>=0.14.0,<0.15",
    "djangorestframework>=3.17.1,<3.18",
    "djangorestframework-simplejwt>=5.5.1,<5.6",
    "drf-spectacular>=0.30.0,<0.31",
    "psycopg[binary]>=3.3.4,<3.4",
    "gunicorn>=26.0.0,<26.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<9.2",
    "pytest-django>=4.12.0,<4.13",
    "ruff>=0.15.22,<0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
